version: "3.8"

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-toor}
      TZ: ${TZ:-UTC}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-toor}"]
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-toor}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    name: redis_data
